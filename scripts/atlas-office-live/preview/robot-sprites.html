<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Atlas pixel — conferência visual isolada</title><style>body{margin:24px;background:#edeaf1;color:#42384e;font:14px system-ui}h1{font-size:20px}.grid{display:grid;grid-template-columns:120px repeat(5,110px);gap:10px;align-items:center}.cell{padding:8px;background:#fff;border-radius:8px;text-align:center}canvas{width:96px;height:136px;image-rendering:pixelated}small{display:block;color:#897995}</style><h1>Atlas pixel · prévia isolada</h1><p>Folha 24×34, quatro direções e passos independentes. A última coluna usa o personagem original da equipe.</p><div class="grid" id="grid"></div><script type="module">
import{atlasSprite}from'../atlas-sprite.ts';import{characterSprite,appearanceFromSeed}from'../../atlas-office-preview/vendor/habblaud/client/src/art';
const grid=document.querySelector('#grid');for(const dir of ['down','up','left','right']){const label=document.createElement('b');label.textContent={down:'Frente',up:'Costas',left:'Esquerda',right:'Direita'}[dir];grid.append(label);for(let frame=0;frame<5;frame++){const s=frame<4?atlasSprite(dir,true,frame):characterSprite({appearance:appearanceFromSeed(3,{look:'m'}),dir,pose:'walk',frame:1,seated:false});const cell=document.createElement('div');cell.className='cell';cell.append(s.canvas.cloneNode());const c=cell.firstChild;c.getContext('2d').drawImage(s.canvas,0,0);const text=document.createElement('small');text.textContent=frame<4?'Passo '+(frame+1):'Equipe';cell.append(text);grid.append(cell);}}
</script></html>
